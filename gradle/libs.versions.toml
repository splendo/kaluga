[versions]
kaluga = "2.0.0"
java = "21"
foojay-resolver = "1.0.0"

androidGradle = "9.1.1"
androidBuildTools = "36.1.0"
androidCompileSdk = "36"
androidMinSdk = "24"
kotlin = "2.4.0"
kotlinter = "5.5.0"
kotlinx-kover = "0.9.8"
dokka = "2.2.0"
vanniktechMavenPublish = "0.36.0"
