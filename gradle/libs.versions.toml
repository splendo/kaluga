androidx-browser = "1.10.0"

compose-multiplatform = "1.11.1"
compose-multiplatform-material3 = "1.12.0-alpha03"
# Jetbrains-published multiplatform ports of AndroidX libraries — release independently of CMP.
jetbrains-navigation = "2.9.2"
jetbrains-lifecycle = "2.10.0"
# AndroidX Compose versions used only by Android-only artifacts (debug tooling, instrumentation
# tests, constraintlayout-compose, activity-compose) for which no CMP equivalent exists.
androidx-compose-ui = "1.11.2"
androidx-compose-tooling = "1.11.2"
androidx-compose-constraintlayout = "1.1.1"
