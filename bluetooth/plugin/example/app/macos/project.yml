# XcodeGen spec for the macOS demo. Run `xcodegen generate` from this directory to (re)generate
# `Demo.xcodeproj`. The framework binary is built and embedded by the
# `:app:shared:embedAndSignAppleFrameworkForXcode` Gradle task wired in as a pre-build script below.

name: Demo
options:
  bundleIdPrefix: com.splendo.kaluga.bluetooth
  deploymentTarget:
    macOS: "11.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "11.0"

targets:
  Demo:
    type: application
    platform: macOS
    sources:
      - path: Demo
    preBuildScripts:
      - name: "Build & embed Kotlin framework"
        script: |
          cd "$SRCROOT/../.."
          ./gradlew :app:shared:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.splendo.kaluga.bluetooth.demo.macos
        INFOPLIST_FILE: Demo/Info.plist
        CODE_SIGN_ENTITLEMENTS: Demo/Demo.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        FRAMEWORK_SEARCH_PATHS:
          - $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../Frameworks"
    dependencies:
      # `embed: false` — the gradle task embeds & signs the framework itself; this entry only
      # provides the link reference (the real binary is resolved via FRAMEWORK_SEARCH_PATHS).
      - framework: ../shared/build/xcode-frameworks/Debug/macosx/Shared.framework
        embed: false
