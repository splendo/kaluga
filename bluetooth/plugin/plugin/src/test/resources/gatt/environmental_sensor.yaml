# Modern Kaluga GATT device definition: the whole device in one file, the field layout the SIG no longer
# publishes machine-readably expressed directly. Equivalent to the environmental_sample/service XML pair.
device: Environmental Sensor
services:
  - name: Environmental Sensing
    uuid: "181A"
    characteristics:
      - uuid: "2BCE"
        access: [read, notify]
      - uuid: "2BCF"
        access: [read]
characteristics:
  - name: Environmental Sample
    uuid: "2BCE"
    fields:
      - name: Temperature
        format: sint16
        decimalExponent: -2
      - name: Humidity
        format: uint16
        decimalExponent: -2
      - name: Pressure
        format: uint32
        multiplier: 10
  - name: Sensor Reading
    uuid: "2BCF"
    variants:
      - name: Temperature
        value: 1
        fields:
          - name: Temperature
            format: sint16
            decimalExponent: -2
      - name: Humidity
        value: 2
        fields:
          - name: Humidity
            format: uint16
            decimalExponent: -2
