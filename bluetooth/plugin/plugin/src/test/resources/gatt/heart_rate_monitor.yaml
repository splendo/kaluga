# Standard device defined entirely by SIG names: every service and characteristic UUID is resolved by the
# assigned-numbers resolver, so no UUIDs appear in the file.
device: Heart Rate Monitor
services:
  - name: Heart Rate
    characteristics:
      - name: Heart Rate Measurement
        access: [notify]
      - name: Body Sensor Location
        access: [read]
  - name: Battery
    characteristics:
      - name: Battery Level
        access: [read, notify]
characteristics:
  - name: Heart Rate Measurement
    fields:
      - { name: Heart Rate, format: uint8 }
  - name: Body Sensor Location
    fields:
      - { name: Location, format: uint8 }
  - name: Battery Level
    fields:
      - { name: Level, format: uint8 }
