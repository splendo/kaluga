# Compose Multiplatform libraries only publish for `iosArm64` and `iosSimulatorArm64` (and on macOS
# only `macosArm64`). This module pulls CMP into commonMain, so we opt out of the legacy Intel
# targets to avoid Gradle variant resolution failures. Honoured by the kaluga multiplatform plugin.
kaluga.omitIosX64=true
kaluga.omitMacosX64=true
