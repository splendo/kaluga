name: "setup tools and caching for macOS workspace"
description: "setup tools and caching for macOS workspace"
inputs:
  kotlinVersion:
    required: true
    description: Kotlin version
  gradle-cache-read-only:
    default: 'true'
    description: Updates gradle cache after actions if not read-only
  restore-workspace-cache:
    default: 'true'
    description: Whether to restore the workspace cache
  project:
    required: false
    description: single project to run

runs:
  using: "composite"
  steps:
    - name: set up JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: 21

    - name: use Xcode 26
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.3'

    - name: Gradle cache
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: ${{ inputs.gradle-cache-read-only }}
        gradle-home-cache-includes: |
          caches
          notifications

    # GitHub macOS runners are arm64-only, so the konan prebuilt path is fixed.
    - name: Konan cache
      uses: actions/cache@v5
      id: konan-cache
      with:
        path: |
          ~/.konan/cache/*
          ~/.konan/kotlin-native-prebuilt-macos-arm64-${{ inputs.kotlinVersion }}/*
          ~/.konan/dependencies/*
        key: konan-${{ inputs.kotlinVersion }}

    - name: Make cache of workspace
      uses: actions/cache/restore@v5
      if: ${{ inputs.restore-workspace-cache != 'false' }}
      id: restore-build
      with:
        path: |
          ./*
          !/.gradle
        key: build-iOS-${{ github.sha }}-${{ inputs.project }}
