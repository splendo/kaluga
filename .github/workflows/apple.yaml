name: Apple tests
on: pull_request

# macOS runners are a scarce, expensive pool; cancel superseded runs on a new push to free them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/setup_macos.yaml
    with:
      gradleTask: compileKotlinIosSimulatorArm64

  validation:
    needs: build
    runs-on: macos-26
    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup tools and cache for workspace
        uses: ./.github/workflows/setup_tools_macos/
        with:
          kotlinVersion: ${{ needs.build.outputs.kotlinVersion }}

      - name: ktLint
        run: ./gradlew lintKotlin

      - name: ktLint report
        uses: actions/upload-artifact@v7
        with:
          name: ktLint report
          path: build/reports/ktlint
        if: ${{ failure() }}

      - name: run checkKotlinAbi
        run: ./gradlew checkKotlinAbi

  test:
    name: ${{ matrix.target.name }} · ${{ matrix.module.name }}
    needs: build
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.build.outputs.projects) }}
        target:
          - name: iOS
            test: iosSimulatorArm64Test
            support: ios
          - name: macOS
            test: macosArm64Test
            support: supportMacOS
          - name: tvOS
            test: tvosSimulatorArm64Test
            support: supportTvOS
          - name: watchOS
            test: watchosSimulatorArm64Test
            support: supportWatchOS
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: Setup tools and cache for workspace
        uses: ./.github/workflows/setup_tools_macos/
        with:
          kotlinVersion: ${{ needs.build.outputs.kotlinVersion }}

      - name: run ${{ matrix.target.name }} tests for ${{ matrix.module.name }}
        if: ${{ matrix.module[matrix.target.support] }}
        run: ./gradlew -p ${{ matrix.module.dir }} ${{ matrix.target.test }}

      - name: Upload ${{ matrix.target.name }} test artifact
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ${{ matrix.module.name }} ${{ matrix.target.name }} Test Report HTML
          path: ${{ format('{0}/**/build/reports/tests/{1}', matrix.module.dir, matrix.target.test) }}

  bluetooth-plugin:
    needs: build
    runs-on: macos-26
    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup tools and cache for workspace
        uses: ./.github/workflows/setup_tools_macos/
        with:
          kotlinVersion: ${{ needs.build.outputs.kotlinVersion }}

      # Validate that the Bluetooth code generation plugin produces code that compiles for iOS.
      - name: validate bluetooth code generation
        run: ./gradlew compileKotlinIosSimulatorArm64
        working-directory: bluetooth/plugin/example

  example-ios:
    needs: build
    runs-on: macos-26
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: Setup tools and cache for workspace
        uses: ./.github/workflows/setup_tools_macos/
        with:
          kotlinVersion: ${{ needs.build.outputs.kotlinVersion }}

      - name: run install
        working-directory: example/ios
        run: |
          brew install sourcery
          ./install.sh

      - name: build example
        working-directory: example/ios
        run: set -o pipefail && xcodebuild -project Demo.xcodeproj -sdk iphonesimulator -scheme Demo -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest'
        shell: bash

      - name: 'upload xcodebuild.log'
        uses: actions/upload-artifact@v7
        with:
          name: 'ios xcodebuild.log'
          path: 'example/ios/xcodebuild.log'

  example-macos:
    needs: build
    runs-on: macos-26
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: Setup tools and cache for workspace
        uses: ./.github/workflows/setup_tools_macos/
        with:
          kotlinVersion: ${{ needs.build.outputs.kotlinVersion }}

      - name: build example
        working-directory: example/macos
        run: set -o pipefail && xcodebuild -project Demo.xcodeproj -scheme Demo -destination 'platform=macOS'
        shell: bash

      - name: 'upload xcodebuild.log'
        uses: actions/upload-artifact@v7
        with:
          name: 'macos xcodebuild.log'
          path: 'example/macos/xcodebuild.log'

  # The per-run workspace cache is only useful within this run; delete it so it doesn't
  # pile up against the repo's 10GB cache quota.
  cleanup-caches:
    needs: [build, validation, test, example-ios, example-macos, bluetooth-plugin]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: delete per-run caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh cache delete "build-iOS-${{ github.sha }}-" --repo ${{ github.repository }} || true
