name: Android tests and example
on: pull_request

jobs:
  example:
    runs-on:
      ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21

      - name: build example
        run: ./gradlew --stacktrace android:assembleDebug
        working-directory: example

  plugins:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21

      - name: ktLint plugins
        run: ./gradlew lintKotlin
        working-directory: plugins

      - name: run plugin unit tests
        run: ./gradlew --stacktrace test
        working-directory: plugins

  bluetooth-plugin:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21

      # Validate that the Bluetooth code generation plugin produces code that compiles for Android.
      - name: validate bluetooth code generation
        run: ./gradlew --stacktrace compileAndroidMain
        working-directory: bluetooth/plugin/example

  bytes-plugin:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21

      - name: ktLint example
        run: ./gradlew lintKotlin
        working-directory: bytes/plugin/example

      # Validate that the Bytes code generation plugin produces code that compiles and passes its
      # round-trip tests on Android host.
      - name: validate bytes code generation
        run: ./gradlew --stacktrace testAndroidHostTest
        working-directory: bytes/plugin/example

      # Same generated-view suites, on the JS and Wasm targets the validation modules also support.
      - name: validate bytes code generation on JS and Wasm
        run: ./gradlew --stacktrace jsNodeTest wasmJsNodeTest
        working-directory: bytes/plugin/example

  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21

      - name: run Android unit tests
        run: ./gradlew testDebugUnitTest testAndroidHostTest koverHtmlReport koverXmlReport

      - name: run KSP processor tests
        run: ./gradlew --stacktrace :bytes:ksp:test :bluetooth:ksp:test :ksp:processor-support:test
      - name: add coverage report to PR
        id: kover
        uses: mi-kas/kover-report@v2
        # this action fails if there is no report, unlike the above actions, so check if there are files
        if: ${{ always() && hashFiles(format('{0}/build/reports/kover/report.xml', github.workspace)) != '' }}
        with:
          path: ${{ github.workspace }}/build/reports/kover/report.xml
          token: ${{ secrets.CI_SPLENDO_PAT }}
          title: Code coverage
          update-comment: true
          coverage-counter-type: LINE
      - name: Upload Android test artifact
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: "Android Test Report HTML"
          path: "**/build/reports/tests/testDebugUnitTest"
      - name: Upload Coverage report
        uses: actions/upload-artifact@v7
        if: ${{ always() && hashFiles(format('{0}/build/reports/kover/html/index.html', github.workspace)) != '' }}
        with:
          name: "Coverage Report HTML"
          path: "**/build/reports/kover/html"
