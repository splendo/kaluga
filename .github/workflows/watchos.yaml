name: watchOS tests
on: pull_request

jobs:
  build:
    uses: ./.github/workflows/setup_macos.yaml
    with:
      gradleTask: compileKotlinWatchosSimulatorArm64

  test:
    needs: build
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.build.outputs.projects) }}
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: Setup tools and cache for workspace
        uses: ./.github/workflows/setup_tools_macos/
        with:
          kotlinVersion: ${{ needs.build.outputs.kotlinVersion }}
          arch: ${{ runner.arch == 'X86' && 'x86' || runner.arch == 'X64' && 'x86_64' || runner.arch == 'ARM' && 'arm32' || 'arm64' }}

      - name: run watchOS tests
        run: |
          if grep -qE 'supportWatchOS\s*=\s*true' "${{ matrix.module }}/build.gradle.kts" 2>/dev/null; then
            ./gradlew :${{ matrix.module }}:watchosSimulatorArm64Test
          else
            echo "Module ${{ matrix.module }} does not declare supportWatchOS = true, skipping"
          fi
      - name: Upload watchOS test artifact
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ${{ matrix.module }} watchOS Test Report HTML
          path: ${{ format('**{0}/build/reports/tests/watchosSimulatorArm64Test', matrix.module) }}
