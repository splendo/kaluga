name: Android Emulator tests
on:
  push:
    branches:
      - feature/bluetooth-netsim-tests
      - feature/bluetooth-netsim-coverage
      - feature/bluetooth-common-scenarios
  pull_request:
  workflow_dispatch:
    inputs:
      project:
        description: 'Feature group directory (e.g. bluetooth) to run tests for; blank runs all'
        required: false
        type: string
      video:
        description: 'Record video'
        required: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

env:
  ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 120

jobs:
  build:
    uses: ./.github/workflows/setup_linux.yaml
    with:
      gradleTask: assembleAndroidTest
      project: bluetooth
      projectBlacklist: hud

  # Creates the AVDs fresh once per run and shares them with the test matrix through a
  # per-run cache that the cleanup job deletes afterwards. Persistent AVD caches were
  # multi-GB and duplicated per branch, keeping the repo over its cache quota so that
  # freshly saved caches (including other workflows') were immediately evicted.
  # google_atd (headless Automated Test Device) would be faster, but as of 2026-06 the
  # android-36 google_atd image is only on the dev sdkmanager channel (stable tops out at 35)
  # and we install from stable, so both legs use google_apis for now. ATD also cannot render
  # for video recording (recordAndroid), so check that trade-off before switching.
  avd:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        api-level: [36]
        include:
          - api-level: 36
            target: google_apis
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: create AVD and generate snapshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-metrics
          disable-animations: true
          arch: x86_64
          disk-size: 3G
          ram-size: 3G
          heap-size: 1500M
          profile: 3.4in WQVGA
          # ubuntu-latest runners have 4 vCPUs; requesting more makes qemu warn and oversubscribe
          cores: 4
          script: ./script/check_emulator.sh

      - name: save AVD cache for this run
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ github.run_id }}-${{ matrix.api-level }}

  test:
    name: ${{ matrix.project.name }} · API ${{ matrix.api-level }}
    needs: [build, avd]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [36]
        project: ${{ fromJSON(needs.build.outputs.projects) }}
        # Keep targets in sync with the avd job (see comment there about google_atd).
        include:
          - api-level: 36
            target: google_apis
    env:
      # The Bluetooth device tests talk to a simulated peripheral on the emulator's virtual radio,
      # which older system images do not have.
      NETSIM: ${{ matrix.project.name == 'bluetooth' && matrix.api-level == 36 }}
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup tools and cache for workspace
        uses: ./.github/workflows/setup_tools_linux/
        with:
          project: bluetooth

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache/restore@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ github.run_id }}-${{ matrix.api-level }}

      # Fallback when the per-run cache was evicted between the avd job and this leg.
      - name: create AVD and generate snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-metrics
          disable-animations: true
          arch: x86_64
          disk-size: 3G
          ram-size: 3G
          heap-size: 1500M
          profile: 3.4in WQVGA
          cores: 4
          script: ./script/check_emulator.sh

      - name: install ffmpeg
        if: inputs.video
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: pregenerate test package
        if: inputs.video
        run: ./gradlew -p ${{ matrix.project.dir }} packageDebugAndroidTest

      - name: install the simulated Bluetooth devices
        if: env.NETSIM == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/netsim"
          "$RUNNER_TEMP/netsim/bin/pip" install -r bluetooth/client/src/deviceScenarios/python/requirements.txt
          echo "NETSIM_PYTHON=$RUNNER_TEMP/netsim/bin/python" >> "$GITHUB_ENV"

      - name: run tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          force-avd-creation: false
          # Bluetooth does not come up on an emulator booted from a snapshot.
          emulator-options: -no-window -gpu swiftshader_indirect ${{ env.NETSIM == 'true' && '-no-snapshot' || '-no-snapshot-save' }} -noaudio -no-boot-anim -camera-back none -camera-front none -no-metrics
          disable-animations: true
          arch: x86_64
          disk-size: 3G
          ram-size: 3G
          heap-size: 1500M
          profile: 3.4in WQVGA
          cores: 4
          script: |
            ./script/check_emulator.sh
            ./script/start_netsim_devices.sh
            ./gradlew ${{ inputs.video && 'recordAndroid' }} -p ${{ matrix.project.dir }} connectedAndroidTest -Pandroid.testInstrumentationRunnerArguments.netsimPeripheral=${{ env.NETSIM }} -Pandroid.testInstrumentationRunnerArguments.netsimCentral=${{ env.NETSIM }}

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: "Android UI tests for ${{ matrix.project.name }}"
          path: "${{ matrix.project.dir }}/**/build/reports/androidTests/connected/debug/**"

      - name: Collect the netsimd logs on failure
        if: failure() && env.NETSIM == 'true'
        run: cp -r "${TMPDIR:-/tmp}/android-$USER/netsimd" netsimd || true

      - name: Upload the simulated device results on failure
        if: failure() && env.NETSIM == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: "Simulated device results for ${{ matrix.project.name }}"
          path: |
            netsim_peripheral.log
            netsim_central.log
            netsim_logcat.txt
            netsimd/
            bluetooth/client/build/reports/androidTests/**
            bluetooth/client/build/outputs/androidTest-results/**
            bluetooth/server/build/reports/androidTests/**
            bluetooth/server/build/outputs/androidTest-results/**

      - name: rename video
        if: always() && inputs.video
        run: mv build/video.mp4 recording-${{ matrix.project.name }}-${{ matrix.api-level }}.mp4

      - name: upload video
        if: always() && inputs.video
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: recording-${{ matrix.project.name }}-${{ matrix.api-level }}
          path: recording-${{ matrix.project.name }}-${{ matrix.api-level }}.mp4

  # Per-run caches are only useful within this run; delete them so they don't pile up
  # against the repo's 10GB cache quota.
  cleanup-caches:
    needs: [build, avd, test]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: delete per-run caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache delete "avd-${{ github.run_id }}-24" --repo ${{ github.repository }} || true
          gh cache delete "avd-${{ github.run_id }}-36" --repo ${{ github.repository }} || true
          gh cache delete "build-linux-${{ github.workflow }}-${{ github.sha }}-${{ inputs.project }}" --repo ${{ github.repository }} || true
