name: macOS tests
on: pull_request

jobs:
  build:
    uses: ./.github/workflows/setup_macos.yaml
    with:
      gradleTask: compileKotlinMacosArm64

  test:
    needs: build
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.build.outputs.projects) }}
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: Setup tools and cache for workspace
        uses: ./.github/workflows/setup_tools_macos/
        with:
          kotlinVersion: ${{ needs.build.outputs.kotlinVersion }}
          arch: ${{ runner.arch == 'X86' && 'x86' || runner.arch == 'X64' && 'x86_64' || runner.arch == 'ARM' && 'arm32' || 'arm64' }}

      - name: run macOS tests
        run: |
          if grep -qE 'supportMacOS\s*=\s*true' "${{ matrix.module }}/build.gradle.kts" 2>/dev/null; then
            ./gradlew :${{ matrix.module }}:macos${{ runner.arch == 'X64' && 'X64' || 'Arm64' }}Test
          else
            echo "Module ${{ matrix.module }} does not declare supportMacOS = true, skipping"
          fi
      - name: Upload macOS test artifact
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ${{ matrix.module }} macOS Test Report HTML
          path: ${{ format('**{0}/build/reports/tests/macos{1}Test', matrix.module, runner.arch == 'X64' && 'X64' || 'Arm64') }}

  example:
    needs: build
    runs-on: macos-26
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: Setup tools and cache for workspace
        uses: ./.github/workflows/setup_tools_macos/
        with:
          kotlinVersion: ${{ needs.build.outputs.kotlinVersion }}
          arch: ${{ runner.arch == 'X86' && 'x86' || runner.arch == 'X64' && 'x86_64' || runner.arch == 'ARM' && 'arm32' || 'arm64' }}

      - name: build example
        working-directory: example/macos
        run: set -o pipefail && xcodebuild -project Demo.xcodeproj -scheme Demo -destination 'platform=macOS'
        shell: bash

      - name: 'upload xcodebuild.log'
        uses: actions/upload-artifact@v7
        with:
          name: "xcodebuild.log"
          path: "example/macos/xcodebuild.log"
